name: PR Review

on:
  pull_request:
    paths:
      - 'dbt/models/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dbt-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the agent can diff the PR against origin/main.
          fetch-depth: 0

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          mkdir -p "$HOME/.snowflake"
          chmod 700 "$HOME/.snowflake"
          cat > "$HOME/.snowflake/connections.toml" <<EOF
          [default]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          password = "$SNOWFLAKE_PASSWORD"
          EOF
          chmod 600 "$HOME/.snowflake/connections.toml"

      - name: Install CoCo CLI
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run dbt-review agent
        run: |
          cortex --print "Use the dbt-review agent to review the changes in this PR" \
            > review.md 2>/dev/null || true
          if [ ! -s review.md ]; then
            echo "The dbt-review agent produced no output." > review.md
          fi

      - name: Post review as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-review
          path: review.md
